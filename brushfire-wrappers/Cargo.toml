[package]
name = "brushfire-wrappers"
version = "0.1.0"
edition = "2021"
description = "Policy-aware wrappers for POSIX utilities in brushfire"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "tail"
path = "src/bin/tail.rs"

[[bin]]
name = "touch"
path = "src/bin/touch.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "ln"
path = "src/bin/ln.rs"

[[bin]]
name = "chmod"
path = "src/bin/chmod.rs"

[[bin]]
name = "chown"
path = "src/bin/chown.rs"

[[bin]]
name = "chgrp"
path = "src/bin/chgrp.rs"

[[bin]]
name = "rmdir"
path = "src/bin/rmdir.rs"

[[bin]]
name = "dd"
path = "src/bin/dd.rs"

[[bin]]
name = "file"
path = "src/bin/file.rs"

[[bin]]
name = "stat"
path = "src/bin/stat.rs"

[[bin]]
name = "sed"
path = "src/bin/sed.rs"

[[bin]]
name = "awk"
path = "src/bin/awk.rs"

[[bin]]
name = "cut"
path = "src/bin/cut.rs"

[[bin]]
name = "paste"
path = "src/bin/paste.rs"

[[bin]]
name = "sort"
path = "src/bin/sort.rs"

[[bin]]
name = "uniq"
path = "src/bin/uniq.rs"

[[bin]]
name = "tr"
path = "src/bin/tr.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "tee"
path = "src/bin/tee.rs"

[[bin]]
name = "diff"
path = "src/bin/diff.rs"

[[bin]]
name = "tar"
path = "src/bin/tar.rs"

[[bin]]
name = "find"
path = "src/bin/find.rs"

[dependencies]
brushfire-policy = { path = "../brushfire-policy" }
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.21"

[dev-dependencies]
tempfile = "3.8"
